<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>询盘后台 · GAORUI STONE</title>
<style>
  :root { --ink:#141210; --line:#e2d9cc; --bg:#f7f3ee; --card:#fff; --copper:#b8763e; --muted:#8a8078; --ok:#2f7d51; --warn:#b4671f; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--copper); }
  header { background:var(--ink); color:#f2ebe1; padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; font-weight:600; }
  header .sp { flex:1; }
  header button, header a { background:transparent; border:1px solid rgba(242,235,225,.28); color:#f2ebe1; padding:6px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; text-decoration:none; }
  header button:hover, header a:hover { border-color:var(--copper); color:#fff; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card b { display:block; font-size:24px; font-weight:600; letter-spacing:-.01em; }
  .card span { color:var(--muted); font-size:12px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .bar input[type=search], .bar select { padding:8px 12px; border:1px solid var(--line); border-radius:9px; background:var(--card); font-size:13px; }
  .bar input[type=search] { min-width:220px; }
  .chip { padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:12px; cursor:pointer; }
  .chip.on { background:var(--ink); color:#f2ebe1; border-color:var(--ink); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th { text-align:left; font-size:11.5px; letter-spacing:.06em; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); background:#fbf8f4; }
  td { padding:11px 12px; border-bottom:1px solid #f0e9df; vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#fdfbf7; }
  .st { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .st-new { background:#fdece0; color:#b4671f; }
  .st-contacted { background:#e6f0fb; color:#2a5d9f; }
  .st-quoting { background:#fff3d6; color:#8a6414; }
  .st-won { background:#e3f3e8; color:var(--ok); }
  .st-lost, .st-archived { background:#eee9e3; color:var(--muted); }
  .msg { max-width:420px; color:#4a423b; }
  .sub { color:var(--muted); font-size:12px; }
  .ops { display:flex; gap:6px; flex-wrap:wrap; }
  .ops button, .ops a { font-size:11.5px; padding:4px 9px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; text-decoration:none; color:var(--ink); }
  .ops button:hover, .ops a:hover { border-color:var(--copper); color:var(--copper); }
  .detail { background:#fbf8f4; }
  .detail td { padding:16px 18px; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px 22px; margin-bottom:12px; }
  .kv div span { display:block; color:var(--muted); font-size:11.5px; }
  textarea.note { width:100%; min-height:64px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; font:inherit; background:#fff; }
  .login { max-width:340px; margin:12vh auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .login h2 { margin:0 0 6px; font-size:18px; }
  .login p { color:var(--muted); margin:0 0 18px; font-size:13px; }
  .login input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:14px; margin-bottom:12px; }
  .login button { width:100%; padding:11px; border:none; border-radius:10px; background:var(--ink); color:#f2ebe1; font-size:14px; cursor:pointer; }
  .err { color:#a33; font-size:12.5px; min-height:18px; margin-bottom:8px; }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--ink); color:#f2ebe1; padding:11px 16px; border-radius:10px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; }
  .toast.on { opacity:1; }
  .empty { text-align:center; padding:44px; color:var(--muted); }
  @media (max-width:760px){ .wrap{padding:14px} th:nth-child(4),td:nth-child(4){display:none} }
</style>
</head>
<body>
<header>
  <h1>GAORUI STONE · 询盘后台</h1>
  <span class="sp"></span>
  <a href="/api/export.csv" id="btn-csv" style="display:none">导出 CSV</a>
  <button id="btn-pwd" style="display:none">修改密码</button>
  <button id="btn-out" style="display:none">退出</button>
</header>

<div class="wrap">
  <section class="login" id="login">
    <h2>登录</h2>
    <p>管理员口令在 Cloudflare Worker Secret 中配置</p>
    <div class="err" id="login-err"></div>
    <input type="password" id="pwd" placeholder="管理员密码" autocomplete="current-password">
    <button id="do-login">进入后台</button>
    <details style="margin-top:16px">
      <summary style="cursor:pointer;font-size:12px;color:var(--muted)">服务地址（分开部署时才需改）</summary>
      <input id="api-base" style="width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px" placeholder="https://api.gaoruistone.com">
      <div class="sub" style="margin-top:6px">当前：<span id="api-now"></span>　留空则用当前站点同源 /api</div>
    </details>
  </section>

  <section id="app" style="display:none">
    <div class="cards" id="cards"></div>
    <div class="bar">
      <input type="search" id="q" placeholder="搜索姓名 / 公司 / 邮箱 / 花色 / 内容">
      <select id="status">
        <option value="">全部状态</option>
        <option value="new">待跟进</option>
        <option value="contacted">已联系</option>
        <option value="quoting">报价中</option>
        <option value="won">已成交</option>
        <option value="lost">未成交</option>
        <option value="archived">归档</option>
      </select>
      <span id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
      <span class="sp" style="flex:1"></span>
      <span class="sub" id="count"></span>
    </div>
    <table>
      <thead><tr><th>日期</th><th>客户</th><th>联系方式</th><th>项目 / 面积 / 花色</th><th>内容</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">暂无询盘。表单提交后会出现在这里。</div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var TOKEN_KEY = 'gaorui_admin_token';
  var BASE_KEY = 'gaorui_api_base';
  // API 基址：同源部署留空即可；静态站放 Pages、API 放 Worker 时填 Worker 域名
  function base() {
    var b = (localStorage.getItem(BASE_KEY) || '').replace(/\/+$/, '');
    return b ? b + '/api/' : '/api/';
  }
  var token = localStorage.getItem(TOKEN_KEY) || '';
  var cache = { items: [], counts: [], stats: null };
  var open = {};

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, 2200);
  }
  function api(path, opt) {
    opt = opt || {};
    opt.headers = opt.headers || {};
    if (token) opt.headers.Authorization = 'Bearer ' + token;
    if (opt.body && typeof opt.body !== 'string') {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(opt.body);
    }
    return fetch(base() + path, opt).then(function (r) {
      if (r.status === 401) { logout(); throw new Error('登录已过期，请重新登录'); }
      var ct = r.headers.get('Content-Type') || '';
      return (ct.indexOf('json') >= 0 ? r.json() : r.text()).then(function (d) {
        if (!r.ok && d && d.error) throw new Error(d.error);
        return d;
      });
    });
  }

  function showApp() {
    $('login').style.display = 'none';
    $('app').style.display = '';
    ['btn-csv', 'btn-pwd', 'btn-out'].forEach(function (i) { $(i).style.display = ''; });
    refresh();
  }
  function logout() {
    localStorage.removeItem(TOKEN_KEY); token = '';
    $('login').style.display = ''; $('app').style.display = 'none';
    ['btn-csv', 'btn-pwd', 'btn-out'].forEach(function (i) { $(i).style.display = 'none'; });
  }

  var ST = { new: '待跟进', contacted: '已联系', quoting: '报价中', won: '已成交', lost: '未成交', archived: '归档' };

  function renderCards() {
    var s = cache.stats || {};
    var inq = s.inquiries || {};
    var v = s.visits || {};
    var c = {};
    (cache.counts || []).forEach(function (r) { c[r.status] = r.c; });
    $('cards').innerHTML = [
      ['待跟进询盘', c.new || 0, '需要今天处理'],
      ['今日新询盘', inq.today || 0, '今天收到的'],
      ['询盘总量', inq.total || 0, '全部记录'],
      ['今日访问', v.today || 0, '页面 PV'],
      ['累计访问', v.total || 0, '自部署起统计']
    ].map(function (x) {
      return '<div class="card"><b>' + x[1] + '</b><span>' + x[0] + '<br>' + x[2] + '</span></div>';
    }).join('');
    $('chips').innerHTML = Object.keys(ST).map(function (k) {
      return '<span class="chip" data-st="' + k + '">' + ST[k] + ' ' + (c[k] || 0) + '</span>';
    }).join('');
    Array.prototype.forEach.call($('chips').querySelectorAll('.chip'), function (el) {
      el.onclick = function () { $('status').value = el.dataset.st; load(); };
    });
  }

  function row(r) {
    var contact = [];
    if (r.email) contact.push('<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>');
    if (r.whatsapp) contact.push('<a href="https://wa.me/' + esc(String(r.whatsapp).replace(/[^0-9]/g, '')) + '" target="_blank" rel="noopener">WhatsApp ' + esc(r.whatsapp) + '</a>');
    if (!contact.length) contact.push('<span class="sub">未留联系方式</span>');

    var meta = [r.project, r.area, r.finish].filter(Boolean).map(esc).join(' · ') || '<span class="sub">—</span>';
    var wa = String(r.whatsapp || '').replace(/[^0-9]/g, '');
    var detail = open[r.id] ? '<tr class="detail"><td colspan="7">' +
      '<div class="kv">' +
      '<div><span>姓名</span>' + esc(r.name) + '</div>' +
      '<div><span>公司</span>' + (esc(r.company) || '—') + '</div>' +
      '<div><span>国家</span>' + (esc(r.country) || '—') + '</div>' +
      '<div><span>来源页</span>' + (esc(r.page) || '—') + '</div>' +
      '<div><span>提交时间</span>' + esc(r.created_at) + ' CST</div>' +
      '<div><span>最后跟进</span>' + (esc(r.updated_at) || '—') + '</div>' +
      '<div><span>IP</span>' + (esc(r.ip) || '—') + '</div>' +
      '<div><span>编号</span>#' + r.id + '</div>' +
      '</div>' +
      '<div style="margin-bottom:12px"><b>完整留言</b><div style="white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-top:6px">' + (esc(r.message) || '（无正文）') + '</div></div>' +
      '<div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">' +
      '<select data-act="status" data-id="' + r.id + '" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px">' +
      Object.keys(ST).map(function (k) { return '<option value="' + k + '"' + (r.status === k ? ' selected' : '') + '>' + ST[k] + '</option>'; }).join('') +
      '</select>' +
      '<textarea class="note" data-act="note" data-id="' + r.id + '" placeholder="内部跟进备注（客户不可见）">' + esc(r.note) + '</textarea>' +
      '<button class="chip" data-act="save" data-id="' + r.id + '">保存跟进</button>' +
      (wa ? '<a class="chip" href="https://wa.me/' + wa + '" target="_blank" rel="noopener">WhatsApp 回复</a>' : '') +
      (r.email ? '<a class="chip" href="mailto:' + esc(r.email) + '?subject=' + encodeURIComponent('Re: Your marble inquiry — GAORUI STONE') + '">邮件回复</a>' : '') +
      '<button class="chip" data-act="del" data-id="' + r.id + '" style="color:#a33;border-color:#e6c9c9">删除</button>' +
      '</div></td></tr>' : '';

    return '<tr>' +
      '<td class="sub">' + esc((r.created_at || '').slice(5, 16)) + '</td>' +
      '<td><b>' + esc(r.name) + '</b>' + (r.company ? '<div class="sub">' + esc(r.company) + (r.country ? ' · ' + esc(r.country) : '') + '</div>' : (r.country ? '<div class="sub">' + esc(r.country) + '</div>' : '')) + '</td>' +
      '<td>' + contact.join('<br>') + '</td>' +
      '<td class="sub">' + meta + '</td>' +
      '<td class="msg">' + esc(String(r.message || '').slice(0, 110)) + (String(r.message || '').length > 110 ? '…' : '') + '</td>' +
      '<td><span class="st st-' + esc(r.status) + '">' + (ST[r.status] || esc(r.status)) + '</span>' + (r.note ? '<div class="sub" style="margin-top:4px">有备注</div>' : '') + '</td>' +
      '<td><div class="ops"><button data-act="toggle" data-id="' + r.id + '">' + (open[r.id] ? '收起' : '展开') + '</button></div></td>' +
      '</tr>' + detail;
  }

  function render() {
    var items = cache.items;
    $('rows').innerHTML = items.map(row).join('');
    $('empty').style.display = items.length ? 'none' : '';
    $('count').textContent = items.length ? '共 ' + items.length + ' 条（最多显示 500 条）' : '';
    bind();
  }

  function bind() {
    Array.prototype.forEach.call($('rows').querySelectorAll('[data-act]'), function (el) {
      var act = el.dataset.act, id = Number(el.dataset.id);
      if (act === 'toggle') el.onclick = function () { open[id] = !open[id]; render(); };
      if (act === 'save') el.onclick = function () {
        var sel = $('rows').querySelector('select[data-id="' + id + '"]');
        var note = $('rows').querySelector('textarea[data-id="' + id + '"]');
        api('inquiries', { method: 'PUT', body: { id: id, status: sel ? sel.value : '', note: note ? note.value : '' } })
          .then(function () { toast('已保存'); load(); }).catch(function (e) { toast(e.message); });
      };
      if (act === 'del') el.onclick = function () {
        if (!confirm('确定删除这条询盘？删除后不可恢复。')) return;
        api('inquiries?id=' + id, { method: 'DELETE' }).then(function () { toast('已删除'); refresh(); }).catch(function (e) { toast(e.message); });
      };
    });
  }

  function load() {
    var q = encodeURIComponent($('q').value.trim());
    var st = encodeURIComponent($('status').value);
    api('inquiries?status=' + st + (q ? '&q=' + q : ''))
      .then(function (d) { cache.items = d.items || []; cache.counts = d.counts || []; render(); renderCards(); })
      .catch(function (e) { toast(e.message); });
  }

  function refresh() {
    api('stats').then(function (d) { cache.stats = d; renderCards(); }).catch(function () {});
    load();
  }

  // ---- 事件 ----
  $('do-login').onclick = doLogin;
  $('pwd').onkeydown = function (e) { if (e.key === 'Enter') doLogin(); };
  function saveBase() {
    var v = ($('api-base').value || '').trim().replace(/\/+$/, '').replace(/\/api$/, '');
    if (v) localStorage.setItem(BASE_KEY, v); else localStorage.removeItem(BASE_KEY);
    showBase();
  }
  function showBase() {
    $('api-base').value = localStorage.getItem(BASE_KEY) || '';
    $('api-now').textContent = base() + 'inquiry';
  }
  $('api-base').onchange = saveBase;
  showBase();
  function doLogin() {
    $('login-err').textContent = '';
    fetch(base() + 'login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pwd').value })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) {
        var msg = d.error || '登录失败';
        if (!localStorage.getItem(BASE_KEY)) {
          msg += '　（若静态站与 API 分开部署：展开下方「服务地址」，填 https://api.gaoruistone.com）';
        }
        $('login-err').textContent = msg;
        return;
      }
      token = d.token; localStorage.setItem(TOKEN_KEY, token); $('pwd').value = ''; showApp();
    }).catch(function () {
      $('login-err').textContent = '无法连接服务器' + (localStorage.getItem(BASE_KEY) ? '：' + base() : '。若本站与 API 分开部署，请在下方「服务地址」填 https://api.gaoruistone.com');
    });
  }

  var timer = null;
  $('q').oninput = function () { clearTimeout(timer); timer = setTimeout(load, 350); };
  $('status').onchange = load;

  $('btn-out').onclick = function () { logout(); toast('已退出'); };
  $('btn-csv').onclick = function (e) { /* 链接带不了 header，改走 fetch */ 
    e.preventDefault();
    api('export.csv').then(function (text) {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gaorui-inquiries-' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click(); toast('已导出');
    }).catch(function (err) { toast(err.message); });
  };
  $('btn-pwd').onclick = function () {
    var oldp = prompt('输入当前密码'); if (!oldp) return;
    var next = prompt('输入新密码（至少 8 位）'); if (!next) return;
    api('password', { method: 'POST', body: { old: oldp, next: next } })
      .then(function () { logout(); toast('密码已修改，请用新密码重新登录'); })
      .catch(function (e) { toast(e.message); });
  };

  if (token) {
    api('stats').then(function (d) { cache.stats = d; showApp(); }).catch(function () { logout(); });
  }
})();
</script>
</body>
</html>
