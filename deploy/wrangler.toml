# GAORUI STONE · Wrangler 配置（路径 B：单 Worker 托管静态站 + API）
# 用法见同目录 README.md。路径 A（Pages + Worker）不需要本文件。
#
# 部署前必做：
#   1) npx wrangler d1 create gaorui-inquiries   → 把返回的 database_id 粘贴到下面
#   2) npx wrangler secret put ADMIN_PASSWORD
#   3) npx wrangler secret put ADMIN_SALT
#   4) 先打包静态站：mkdir -p public && cp ../*.html public/ && cp -r ../assets public/ && cp admin.html public/
#   5) npx wrangler deploy

name = "gaorui-site"
main = "gaorui-worker.js"
compatibility_date = "2025-06-01"

# 静态资源：8 个自包含 HTML + assets/img（og:image 依赖其中的 hero-main.jpg）+ admin.html
[assets]
directory = "./public"
binding = "ASSETS"
# 让 Worker 先跑，/api/* 由 Worker 处理，其余再回落到静态资源
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "gaorui-inquiries"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 说明：
# - ADMIN_PASSWORD / ADMIN_SALT / NOTIFY_WEBHOOK / ALLOWED_ORIGINS 用 `wrangler secret put` 设置，
#   不要写进本文件（本文件可能被提交到仓库）。
# - 表结构由 Worker 首次请求时自动创建，无需手写 migration。
# - 本地调试：npx wrangler dev（D1 用本地 SQLite，Secret 需在 .dev.vars 里临时提供）。
